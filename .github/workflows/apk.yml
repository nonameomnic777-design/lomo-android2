name: Compilar APK de Lomo

on:
  workflow_dispatch:        # botón "Run workflow" en la pestaña Actions
  push:
    branches: [main, master]
    paths-ignore: ['**.md', '**.txt']

permissions:
  contents: write           # para publicar el APK en "Releases"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias (y copiar librerías y fuentes)
        run: npm install --no-audit --no-fund

      - name: Preparar la carpeta www
        run: node tools/make-www.js

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Iconos, pantalla de inicio y ajustes
        run: python3 tools/patch_android.py

      - name: Sincronizar la app con Android
        run: npx cap sync android

      - name: Usar la firma fija de Lomo
        run: |
          mkdir -p ~/.android
          cp tools/lomo-debug.keystore ~/.android/debug.keystore

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Poner nombre al APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Lomo.apk

      - name: Guardar como archivo de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: Lomo-apk
          path: Lomo.apk

      - name: Publicar en Releases (enlace de descarga fijo)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest Lomo.apk \
            --title "Lomo para Android" \
            --notes "APK de Lomo compilado automáticamente. Descárgalo e instálalo en tu teléfono."
